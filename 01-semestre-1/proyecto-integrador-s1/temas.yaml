# Taxonomía curada: tema → estantes de Goodreads que lo componen.
# Criterio (ver notebook 01): solo estantes temáticos; se excluyen los organizativos (to-read,
# owned, kindle, read-in-*, dnf…) y los combinados ambiguos (sci-fi-fantasy, mystery-thriller va a
# thriller por ser el uso mayoritario). Cada estante pertenece a un único tema.
